<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 85%;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        p {
            text-align: center;
            color: #666;
        }

        h2 {
            color: #2c3e50;
            margin-top: 30px;
        }

        .add-btn {
            display: inline-block;
            background-color: #2878c8;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #e8edf3;
        }

        .edit-btn {
            background-color: #279b62;
            color: white;
            padding: 7px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete-btn {
            background-color: #d9534f;
            color: white;
            padding: 7px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-form {
            display: inline;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>
        <p>Manage student records easily</p>

        <a href="/add" class="add-btn">Add New Student</a>

        <h2>Student Records</h2>

        <table>
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Action</th>
            </tr>

            {% for student in students %}
            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>

                <td>
                    <a href="/update/{{ student[0] }}" class="edit-btn">
                        Edit
                    </a>

                    <form action="/delete/{{ student[0] }}"
                          method="POST"
                          class="delete-form"
                          onsubmit="return confirm('Delete this student?');">

                        <button type="submit" class="delete-btn">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}

            {% if students|length == 0 %}
            <tr>
                <td colspan="4">No student records available.</td>
            </tr>
            {% endif %}

        </table>

    </div>

</body>
</html>
